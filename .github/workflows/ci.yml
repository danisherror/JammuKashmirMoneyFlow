name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.8.4
      - name: Ruff
        run: ruff check backend

  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # Route tests import the FastAPI app modules and run against SQLite (aiosqlite).
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Pytest
        run: pytest -q

  frontend-build:
    name: Frontend build + tests (tsc, vitest, vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build

  api-types:
    name: Generated API types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Export OpenAPI schema
        working-directory: backend
        run: python -m scripts.export_openapi ../frontend/openapi.json
      - name: Generate TypeScript types
        working-directory: frontend
        run: npm ci && npm run gen:api
      - name: Fail if the committed files are stale
        run: |
          git diff --exit-code -- frontend/openapi.json frontend/src/lib/api-schema.ts || {
            echo "::error::Regenerate: cd backend && python -m scripts.export_openapi ../frontend/openapi.json && cd ../frontend && npm run gen:api"
            exit 1
          }

  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from template
        run: cp .env.example .env
      - name: Build images
        run: docker compose build
